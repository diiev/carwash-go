<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CarWash PRO</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; overflow: hidden; }
        .custom-scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        /* Фикс для мобильных */
        .pb-safe { padding-bottom: calc(60px + env(safe-area-inset-bottom)); }
    </style>
</head>
<body>

<div id="app" class="h-screen w-full flex flex-col md:flex-row bg-gray-100 text-gray-800">

    <div v-if="!user" class="fixed inset-0 z-[100] bg-blue-600 flex items-center justify-center p-6">
        <div class="bg-white p-8 rounded-2xl w-full max-w-sm shadow-2xl">
            <h1 class="text-2xl font-bold text-center mb-6">Вход</h1>
            <input v-model="loginForm.username" placeholder="Логин" class="w-full mb-3 p-3 border rounded-lg">
            <input v-model="loginForm.password" type="password" placeholder="Пароль" class="w-full mb-6 p-3 border rounded-lg">
            <button @click="login" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700">Войти</button>
            <p v-if="loginError" class="text-red-500 text-center mt-3">{{ loginError }}</p>
        </div>
    </div>

    <template v-else>
        
        <aside class="hidden md:flex w-64 flex-col bg-slate-900 text-white shrink-0">
            <div class="p-6 text-center border-b border-slate-700">
                <h2 class="text-xl font-bold">CarWash</h2>
                <p class="text-xs opacity-50">{{ user.name }}</p>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <a @click="currentTab='home'" :class="currentTab=='home'?'bg-blue-600':''" class="flex items-center gap-3 p-3 rounded hover:bg-slate-800 cursor-pointer"><i class="fas fa-home w-6"></i> Главная</a>
                <a @click="currentTab='reports'" :class="currentTab=='reports'?'bg-blue-600':''" class="flex items-center gap-3 p-3 rounded hover:bg-slate-800 cursor-pointer"><i class="fas fa-chart-pie w-6"></i> Отчеты</a>
                <a v-if="user.role=='admin'" @click="currentTab='services'" :class="currentTab=='services'?'bg-blue-600':''" class="flex items-center gap-3 p-3 rounded hover:bg-slate-800 cursor-pointer"><i class="fas fa-list w-6"></i> Услуги</a>
                <a v-if="user.role=='admin'" @click="currentTab='expenses'" :class="currentTab=='expenses'?'bg-blue-600':''" class="flex items-center gap-3 p-3 rounded hover:bg-slate-800 cursor-pointer"><i class="fas fa-receipt w-6"></i> Расходы</a>
                <a v-if="user.role=='admin'" @click="currentTab='users'" :class="currentTab=='users'?'bg-blue-600':''" class="flex items-center gap-3 p-3 rounded hover:bg-slate-800 cursor-pointer"><i class="fas fa-users w-6"></i> Сотрудники</a>
            </nav>
            <div class="p-4"><button @click="logout" class="w-full py-2 bg-slate-800 rounded">Выход</button></div>
        </aside>

        <main class="flex-1 flex flex-col h-full overflow-hidden relative">
            
            <header class="md:hidden bg-blue-600 text-white p-4 flex justify-between items-center shadow shrink-0">
                <div><h1 class="font-bold">Мойка</h1><p class="text-xs opacity-80">{{ user.name }}</p></div>
                <button @click="logout"><i class="fas fa-sign-out-alt"></i></button>
            </header>

            <div class="flex-1 custom-scroll p-4 md:p-8 pb-safe">
                
                <div v-if="currentTab === 'home'" class="max-w-5xl mx-auto">
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="bg-white p-4 rounded-xl shadow border">
                            <p class="text-xs text-gray-500">Выручка ({{ dateLabel }})</p>
                            <p class="text-xl font-bold">{{ formatMoney(stats.totalRevenue) }}</p>
                        </div>
                        <div class="bg-white p-4 rounded-xl shadow border">
                            <p class="text-xs text-gray-500">Мой доход (50%)</p>
                            <p class="text-xl font-bold text-blue-600">{{ formatMoney(stats.myEarnings) }}</p>
                        </div>
                    </div>

                    <div class="bg-white p-5 rounded-2xl shadow mb-6 border-l-4 border-blue-600">
                        <h3 class="font-bold mb-3">Добавить авто</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <input type="date" v-model="newEntry.date" class="border p-2 rounded">
                            
                            <select v-if="user.role=='admin'" v-model="newEntry.selectedWorkerId" class="border p-2 rounded font-bold">
                                <option :value="user.id">Я</option>
                                <option v-for="u in usersList" :value="u.id">{{ u.name }}</option>
                            </select>

                            <input v-model="newEntry.carModel" placeholder="Марка" class="border p-2 rounded">
                            
                            <select v-model="selectedService" @change="onServiceChange" class="border p-2 rounded">
                                <option :value="null">Выберите услугу...</option>
                                <option v-for="s in servicesList" :value="s">{{ s.name }} ({{ s.price }})</option>
                                <option value="custom">Своя...</option>
                            </select>
                            
                            <input v-if="selectedService=='custom'" v-model="newEntry.description" placeholder="Название услуги" class="border p-2 rounded">

                            <div class="flex gap-2 col-span-1 md:col-span-2">
                                <input type="number" v-model.number="newEntry.price" placeholder="Сумма" class="w-full border p-2 rounded font-bold text-lg">
                                <button @click="addWash" :disabled="!newEntry.price" class="bg-blue-600 text-white px-6 rounded shadow"><i class="fas fa-plus"></i></button>
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-between items-center mb-2">
                        <h3 class="font-bold text-gray-500 uppercase text-xs">История</h3>
                        <input type="date" v-model="homeDate" class="border rounded p-1 text-xs">
                    </div>
                    <div class="space-y-2">
                        <div v-if="washes.length===0" class="text-center py-6 text-gray-400 border rounded-xl bg-white">Нет записей</div>
                        <div v-for="w in washes" :key="w.id" class="bg-white p-3 rounded-xl shadow-sm border flex justify-between items-center">
                            <div>
                                <p class="font-bold text-sm">{{ w.car_model || 'Авто' }}</p>
                                <p class="text-xs text-gray-500">{{ w.description }} <span v-if="user.role=='admin'" class="bg-gray-100 px-1 rounded">{{ w.worker_name }}</span></p>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="font-bold text-blue-600">+{{ formatMoney(w.price) }}</span>
                                <div class="flex gap-1">
                                    <button @click="openWashModal(w)" class="text-blue-400 p-1"><i class="fas fa-pen"></i></button>
                                    <button @click="deleteWash(w.id)" class="text-red-400 p-1"><i class="fas fa-trash"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div v-if="currentTab === 'reports'" class="max-w-5xl mx-auto">
                    <div class="bg-white p-5 rounded-2xl shadow mb-4">
                        <h3 class="font-bold mb-3">Фильтры</h3>
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                            <input type="date" v-model="reportDates.start" class="border p-2 rounded">
                            <input type="date" v-model="reportDates.end" class="border p-2 rounded">
                            <select v-if="user.role=='admin'" v-model="reportFilterId" class="border p-2 rounded">
                                <option :value="0">Все сотрудники</option>
                                <option v-for="u in usersList" :value="u.id">{{ u.name }}</option>
                            </select>
                            <button @click="fetchData" class="bg-slate-800 text-white rounded p-2">Обновить</button>
                        </div>
                    </div>

                    <div v-if="user.role=='admin'" class="space-y-4">
                        <div class="bg-slate-800 text-white p-5 rounded-2xl shadow">
                            <p class="text-slate-400 text-sm">Чистая прибыль</p>
                            <h2 class="text-3xl font-bold text-green-400">{{ formatMoney(stats.netProfit) }}</h2>
                            <div class="text-xs mt-2 text-slate-400 flex justify-between">
                                <span>Выручка: {{ formatMoney(stats.totalRevenue) }}</span>
                                <span>Расходы: {{ formatMoney(stats.totalExpenses) }}</span>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="bg-white p-4 rounded-xl shadow">
                                <h4 class="font-bold mb-2 text-sm border-b pb-1">Зарплаты</h4>
                                <div v-for="(amt, name) in stats.workerBreakdown" class="flex justify-between py-1 text-sm border-b last:border-0">
                                    <span>{{ name }}</span>
                                    <span class="font-bold text-blue-600">{{ formatMoney(amt/2) }}</span>
                                </div>
                            </div>
                            <div class="bg-white p-4 rounded-xl shadow">
                                <h4 class="font-bold mb-2 text-sm border-b pb-1">Расходы</h4>
                                <div v-for="e in expenses" class="flex justify-between py-1 text-sm border-b last:border-0">
                                    <span>{{ e.title }} <small class="text-gray-400">{{ formatDate(e.date_only) }}</small></span>
                                    <span class="font-bold text-red-500">-{{ formatMoney(e.amount) }}</span>
                                </div>
                                <div v-if="expenses.length===0" class="text-xs text-gray-400">Нет расходов</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div v-if="currentTab === 'services' && user.role=='admin'" class="max-w-5xl mx-auto">
                    <div class="flex justify-between mb-4">
                        <h2 class="font-bold text-xl">Прайс-лист</h2>
                        <button @click="openServiceModal()" class="bg-blue-600 text-white px-3 py-1 rounded">Добавить</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <div v-for="s in servicesList" class="bg-white p-4 rounded-xl shadow border relative">
                             <div class="absolute top-2 right-2">
                                <button @click="openServiceModal(s)" class="text-blue-500 mr-2"><i class="fas fa-pen"></i></button>
                                <button @click="deleteService(s.id)" class="text-red-400"><i class="fas fa-trash"></i></button>
                            </div>
                            <h3 class="font-bold">{{ s.name }}</h3>
                            <p class="text-blue-600 font-bold">{{ formatMoney(s.price) }}</p>
                        </div>
                    </div>
                </div>

                <div v-if="currentTab === 'users' && user.role=='admin'" class="max-w-5xl mx-auto">
                    <div class="flex justify-between mb-4">
                        <h2 class="font-bold text-xl">Сотрудники</h2>
                        <button @click="openUserModal()" class="bg-blue-600 text-white px-3 py-1 rounded">Добавить</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <div v-for="u in usersList" class="bg-white p-4 rounded-xl shadow border relative">
                             <div class="absolute top-2 right-2" v-if="u.username!='admin'">
                                <button @click="openUserModal(u)" class="text-blue-500 mr-2"><i class="fas fa-pen"></i></button>
                                <button @click="deleteUser(u.id)" class="text-red-400"><i class="fas fa-trash"></i></button>
                            </div>
                            <h3 class="font-bold">{{ u.name }}</h3>
                            <p class="text-sm text-gray-500">{{ u.role }} | {{ u.username }}</p>
                        </div>
                    </div>
                </div>

                <div v-if="currentTab === 'expenses'" class="max-w-5xl mx-auto">
                    <div class="bg-white p-5 rounded-2xl shadow mb-4">
                        <h3 class="font-bold mb-3">Добавить расход</h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                            <input type="date" v-model="newExpense.date" class="border p-2 rounded">
                            <input v-model="newExpense.title" placeholder="Название" class="border p-2 rounded">
                            <div class="flex gap-2">
                                <input type="number" v-model.number="newExpense.amount" placeholder="Сумма" class="w-full border p-2 rounded">
                                <button @click="addExpense" class="bg-red-500 text-white px-4 rounded"><i class="fas fa-plus"></i></button>
                            </div>
                        </div>
                    </div>
                    <div v-for="e in expenses" class="bg-white p-3 rounded-lg border-l-4 border-red-500 shadow mb-2 flex justify-between">
                        <span>{{ e.title }} <small class="text-gray-400">{{ formatDate(e.date_only) }}</small></span>
                        <span class="font-bold text-red-500">-{{ formatMoney(e.amount) }}</span>
                    </div>
                </div>

            </div>

            <nav class="md:hidden bg-white border-t flex justify-around py-3 shrink-0">
                <button @click="currentTab='home'" :class="currentTab=='home'?'text-blue-600':''" class="flex flex-col items-center text-xs"><i class="fas fa-home text-lg"></i>Главная</button>
                <button @click="currentTab='reports'" :class="currentTab=='reports'?'text-blue-600':''" class="flex flex-col items-center text-xs"><i class="fas fa-chart-pie text-lg"></i>Отчеты</button>
                <button v-if="user.role=='admin'" @click="currentTab='services'" :class="currentTab=='services'?'text-blue-600':''" class="flex flex-col items-center text-xs"><i class="fas fa-list text-lg"></i>Услуги</button>
                <button v-if="user.role=='admin'" @click="currentTab='expenses'" :class="currentTab=='expenses'?'text-red-500':''" class="flex flex-col items-center text-xs"><i class="fas fa-receipt text-lg"></i>Расходы</button>
            </nav>
        </main>
    </template>

    <div v-if="showServiceModal" class="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-xl w-full max-w-sm">
            <h3 class="font-bold text-lg mb-4">Услуга</h3>
            <input v-model="editingService.name" placeholder="Название" class="w-full border p-2 rounded mb-2">
            <input v-model.number="editingService.price" placeholder="Цена" class="w-full border p-2 rounded mb-4">
            <div class="flex gap-2"><button @click="showServiceModal=false" class="w-1/2 bg-gray-200 p-2 rounded">Отмена</button><button @click="saveService" class="w-1/2 bg-blue-600 text-white p-2 rounded">Сохранить</button></div>
        </div>
    </div>
    
    <div v-if="showUserModal" class="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-xl w-full max-w-sm">
            <h3 class="font-bold text-lg mb-4">Сотрудник</h3>
            <input v-model="editingUser.name" placeholder="Имя" class="w-full border p-2 rounded mb-2">
            <input v-model="editingUser.username" placeholder="Логин" class="w-full border p-2 rounded mb-2">
            <input v-model="editingUser.password" placeholder="Пароль" class="w-full border p-2 rounded mb-2">
            <select v-model="editingUser.role" class="w-full border p-2 rounded mb-4"><option value="worker">Мойщик</option><option value="admin">Админ</option></select>
            <div class="flex gap-2"><button @click="showUserModal=false" class="w-1/2 bg-gray-200 p-2 rounded">Отмена</button><button @click="saveUser" class="w-1/2 bg-blue-600 text-white p-2 rounded">Сохранить</button></div>
        </div>
    </div>

    <div v-if="showWashModal" class="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-xl w-full max-w-sm">
            <h3 class="font-bold text-lg mb-4">Редактировать</h3>
            <input type="date" v-model="editingWash.date_only" class="w-full border p-2 rounded mb-2">
            <input v-model="editingWash.car_model" placeholder="Марка" class="w-full border p-2 rounded mb-2">
            <input v-model="editingWash.description" placeholder="Услуга" class="w-full border p-2 rounded mb-2">
            <input v-model.number="editingWash.price" placeholder="Цена" class="w-full border p-2 rounded mb-4">
            <div class="flex gap-2"><button @click="showWashModal=false" class="w-1/2 bg-gray-200 p-2 rounded">Отмена</button><button @click="saveWash" class="w-1/2 bg-blue-600 text-white p-2 rounded">Сохранить</button></div>
        </div>
    </div>

</div>

<script>
    const { createApp, ref, computed, onMounted, watch } = Vue;
    const API_URL = 'http://localhost:8080/api';

    createApp({
        setup() {
            const today = new Date().toISOString().split('T')[0];
            const user = ref(null);
            const loginForm = ref({});
            const loginError = ref('');
            const currentTab = ref(localStorage.getItem('cw_tab') || 'home');
            
            // Dates
            const homeDate = ref(today);
            const reportDates = ref(JSON.parse(localStorage.getItem('cw_dates') || JSON.stringify({start: today, end: today})));
            const reportFilterId = ref(0);

            // Data
            const washes = ref([]);
            const expenses = ref([]);
            const usersList = ref([]);
            const servicesList = ref([]);
            
            // Forms
            const newEntry = ref({ date: today, price: '', carModel: '', description: '', selectedWorkerId: null });
            const selectedService = ref(null);
            const newExpense = ref({ date: today, title: '', amount: '' });

            // Modals
            const showServiceModal = ref(false); const editingService = ref({});
            const showUserModal = ref(false); const editingUser = ref({});
            const showWashModal = ref(false); const editingWash = ref({});

            const api = async (action, data = {}) => {
                try {
                    const res = await fetch(`${API_URL}?action=${action}`, { method: 'POST', body: JSON.stringify(data) });
                    return await res.json();
                } catch(e) { console.error(e); return { success: false }; }
            };

            const loadData = async () => {
                let start = currentTab.value === 'home' ? homeDate.value : reportDates.value.start;
                let end = currentTab.value === 'home' ? homeDate.value : reportDates.value.end;
                
                const res = await api('get_report', { 
                    start, end, user_id: user.value.id, role: user.value.role, filter_id: reportFilterId.value 
                });
                washes.value = res.washes || [];
                expenses.value = res.expenses || [];
            };

            const loadAux = async () => {
                if(user.value.role === 'admin') { usersList.value = await api('get_users') || []; }
                servicesList.value = await api('get_services') || [];
            };

            // Handlers
            const login = async () => {
                const res = await api('login', loginForm.value);
                if(res.success) { user.value = res.user; localStorage.setItem('cw_user', JSON.stringify(user.value)); loadAux(); loadData(); }
                else loginError.value = "Ошибка входа";
            };
            const logout = () => { user.value = null; localStorage.removeItem('cw_user'); };
            
            const onServiceChange = () => {
                if(selectedService.value && selectedService.value !== 'custom') {
                    newEntry.value.description = selectedService.value.name;
                    newEntry.value.price = selectedService.value.price;
                } else if(selectedService.value === 'custom') {
                    newEntry.value.description = ''; newEntry.value.price = '';
                }
            };

            const addWash = async () => {
                await api('add_wash', { ...newEntry.value, user_id: newEntry.value.selectedWorkerId || user.value.id });
                newEntry.value.price = ''; newEntry.value.carModel = ''; selectedService.value = null; loadData();
            };
            const saveWash = async () => { await api('edit_wash', { ...editingWash.value, date: editingWash.value.date_only }); showWashModal.value = false; loadData(); };
            const deleteWash = async (id) => { if(confirm('Удалить?')) { await api('delete_wash', { id }); loadData(); } };

            const saveService = async () => { await api('save_service', { id: editingService.value.id, service_name: editingService.value.name, service_price: editingService.value.price }); showServiceModal.value = false; loadAux(); };
            const deleteService = async (id) => { if(confirm('Архивировать?')) { await api('delete_service', { id }); loadAux(); } };

            const saveUser = async () => { await api('save_user', editingUser.value); showUserModal.value = false; loadAux(); };
            const deleteUser = async (id) => { if(confirm('Архивировать?')) { await api('delete_user', { id }); loadAux(); } };
            
            const addExpense = async () => { await api('add_expense', newEntry.value); loadData(); }; // fixme: use newExpense
            const realAddExpense = async () => { if(!newExpense.value.amount) return; await api('add_expense', newExpense.value); newExpense.value.amount = ''; loadData(); };

            // Computed
            const stats = computed(() => {
                const rev = washes.value.reduce((a, b) => a + b.price, 0);
                const exp = expenses.value.reduce((a, b) => a + b.amount, 0);
                const breakdown = {};
                washes.value.forEach(w => breakdown[w.worker_name || 'X'] = (breakdown[w.worker_name || 'X'] || 0) + w.price);
                return { totalRevenue: rev, totalExpenses: exp, netProfit: (rev/2) - exp, myEarnings: rev/2, workerBreakdown: breakdown };
            });
            const dateLabel = computed(() => currentTab.value==='home' ? (homeDate.value===today?'Сегодня':homeDate.value) : `${reportDates.value.start}/${reportDates.value.end}`);
            const formatMoney = (v) => new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB', maximumFractionDigits: 0 }).format(v);
            const formatDate = (v) => v ? new Date(v).toLocaleDateString('ru-RU') : '';

            // Modal openers
            const openServiceModal = (s=null) => { editingService.value = s ? {...s} : {}; showServiceModal.value = true; };
            const openUserModal = (u=null) => { editingUser.value = u ? {...u, password:''} : {role:'worker'}; showUserModal.value = true; };
            const openWashModal = (w) => { editingWash.value = {...w, date_only: w.date_only}; showWashModal.value = true; };

            onMounted(() => {
                const u = localStorage.getItem('cw_user');
                if(u) { user.value = JSON.parse(u); loadAux(); loadData(); }
            });
            watch(currentTab, (v) => { localStorage.setItem('cw_tab', v); loadData(); });
            watch(homeDate, () => { if(currentTab.value==='home') { newEntry.value.date = homeDate.value; loadData(); } });
            watch([reportDates, reportFilterId], () => { if(currentTab.value==='reports') { localStorage.setItem('cw_dates', JSON.stringify(reportDates.value)); loadData(); } }, {deep:true});

            return { 
                user, loginForm, loginError, login, logout, currentTab, 
                washes, expenses, usersList, servicesList, newEntry, newExpense, selectedService,
                homeDate, reportDates, reportFilterId, dateLabel, stats, formatMoney, formatDate,
                showServiceModal, editingService, openServiceModal, saveService, deleteService,
                showUserModal, editingUser, openUserModal, saveUser, deleteUser,
                showWashModal, editingWash, openWashModal, saveWash, deleteWash,
                addWash, addExpense: realAddExpense, onServiceChange
            };
        }
    }).mount('#app');
</script>
</body>
</html>
