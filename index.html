<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarWash Manager</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .fade-enter-active, .fade-leave-active { transition: opacity 0.2s ease; }
        .fade-enter-from, .fade-leave-to { opacity: 0; }
    </style>
</head>
<body>

<div id="app" class="h-screen flex overflow-hidden text-gray-800">

    <div v-if="!user" class="fixed inset-0 z-50 bg-blue-600 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl w-full max-w-sm shadow-2xl">
            <div class="text-center mb-6">
                <i class="fas fa-car-wash text-4xl text-blue-600"></i>
                <h1 class="text-2xl font-bold mt-2">Вход</h1>
            </div>
            <input v-model="loginForm.username" placeholder="Логин" class="w-full mb-3 p-3 border rounded-lg bg-gray-50 outline-none">
            <input v-model="loginForm.password" type="password" placeholder="Пароль" class="w-full mb-6 p-3 border rounded-lg bg-gray-50 outline-none">
            <button @click="login" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">Войти</button>
            <p v-if="loginError" class="text-red-500 text-center mt-3 text-sm">{{ loginError }}</p>
        </div>
    </div>

    <template v-else>
        <aside class="hidden md:flex w-64 flex-col bg-slate-900 text-white shadow-xl">
            <div class="p-6 text-center border-b border-slate-700">
                <h2 class="text-xl font-bold">CarWash <span class="text-blue-400">PRO</span></h2>
                <p class="text-xs text-slate-400 mt-1">{{ user.name }}</p>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <a @click="currentTab='home'" :class="{'bg-blue-600': currentTab==='home'}" class="flex items-center gap-3 p-3 rounded-lg cursor-pointer hover:bg-slate-800 transition">
                    <i class="fas fa-home w-6 text-center"></i> Главная
                </a>
                <a @click="currentTab='reports'" :class="{'bg-blue-600': currentTab==='reports'}" class="flex items-center gap-3 p-3 rounded-lg cursor-pointer hover:bg-slate-800 transition">
                    <i class="fas fa-chart-pie w-6 text-center"></i> Отчеты
                </a>
                <a v-if="user.role === 'admin'" @click="currentTab='users'" :class="{'bg-blue-600': currentTab==='users'}" class="flex items-center gap-3 p-3 rounded-lg cursor-pointer hover:bg-slate-800 transition">
                    <i class="fas fa-users w-6 text-center"></i> Сотрудники
                </a>
                <a v-if="user.role === 'admin'" @click="currentTab='expenses'" :class="{'bg-blue-600': currentTab==='expenses'}" class="flex items-center gap-3 p-3 rounded-lg cursor-pointer hover:bg-slate-800 transition">
                    <i class="fas fa-receipt w-6 text-center"></i> Расходы
                </a>
            </nav>
            <div class="p-4 border-t border-slate-700">
                <button @click="logout" class="w-full py-2 bg-slate-800 rounded text-sm hover:bg-slate-700 text-slate-300">Выход</button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-full relative bg-gray-100">
            <header class="md:hidden bg-blue-600 text-white p-4 flex justify-between items-center shadow-md z-10 sticky top-0">
                <div>
                    <h1 class="font-bold text-lg">Мойка</h1>
                    <p class="text-[10px] opacity-80">{{ user.name }}</p>
                </div>
                <div class="flex items-center gap-3">
                    <div class="text-right">
                        <p class="text-[10px] opacity-70">Сегодня</p>
                        <p class="font-bold text-sm">{{ formatMoney(todayStats.totalRevenue) }}</p>
                    </div>
                    <button @click="logout" class="bg-white/20 p-2 rounded"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto p-4 md:p-8 custom-scroll pb-24 md:pb-8">
                
                <div v-if="currentTab === 'home'" class="max-w-5xl mx-auto animate-fade-in">
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                            <p class="text-xs text-gray-500">Выручка ({{ dateLabel }})</p>
                            <p class="text-xl md:text-2xl font-bold text-gray-800">{{ formatMoney(stats.totalRevenue) }}</p>
                        </div>
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                             <p class="text-xs text-gray-500">Мой доход (50%)</p>
                             <p class="text-xl md:text-2xl font-bold text-blue-600">{{ formatMoney(stats.myEarnings) }}</p>
                        </div>
                    </div>

                    <div class="bg-white p-5 rounded-2xl shadow-md mb-6 border-l-4 border-blue-600">
                        <h3 class="font-bold text-gray-700 mb-4 text-lg">Добавить машину</h3>
                        <div class="grid grid-cols-1 md:grid-cols-12 gap-3">
                            <div class="md:col-span-2">
                                <label class="text-[10px] text-gray-400 uppercase tracking-wider mb-1 block">Дата</label>
                                <input type="date" v-model="newEntry.date" class="w-full border p-2.5 rounded-lg bg-gray-50 text-sm">
                            </div>
                            <div v-if="user.role === 'admin'" class="md:col-span-2">
                                <label class="text-[10px] text-gray-400 uppercase tracking-wider mb-1 block">Мойщик</label>
                                <select v-model="newEntry.selectedWorkerId" class="w-full border p-2.5 rounded-lg bg-gray-50 text-sm font-bold text-blue-800">
                                    <option :value="user.id">Я ({{ user.name }})</option>
                                    <option v-for="u in usersList" :key="u.id" :value="u.id">{{ u.name }}</option>
                                </select>
                            </div>
                            <div class="md:col-span-5 grid grid-cols-2 gap-2">
                                <div>
                                    <label class="text-[10px] text-gray-400 uppercase tracking-wider mb-1 block">Марка</label>
                                    <input type="text" v-model="newEntry.carModel" placeholder="BMW" class="w-full border p-2.5 rounded-lg bg-gray-50 text-sm">
                                </div>
                                <div>
                                    <label class="text-[10px] text-gray-400 uppercase tracking-wider mb-1 block">Услуга</label>
                                    <input type="text" v-model="newEntry.description" placeholder="Кузов" class="w-full border p-2.5 rounded-lg bg-gray-50 text-sm">
                                </div>
                            </div>
                            <div class="md:col-span-3">
                                 <label class="text-[10px] text-gray-400 uppercase tracking-wider mb-1 block">Сумма</label>
                                 <div class="flex gap-2">
                                    <input type="number" v-model.number="newEntry.price" placeholder="0" class="w-full border border-blue-200 p-2.5 rounded-lg font-bold text-gray-800 bg-white text-lg">
                                    <button @click="addWash" :disabled="!newEntry.price" class="bg-blue-600 hover:bg-blue-700 text-white px-5 rounded-lg shadow-lg transition"><i class="fas fa-plus"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-between items-end mb-3 border-b border-gray-200 pb-2">
                        <div>
                            <h3 class="font-bold text-gray-600 uppercase text-xs tracking-wider">История операций</h3>
                            <p class="text-[10px] text-gray-400 mt-1">Всего машин: {{ washes.length }}</p>
                        </div>
                        <div class="text-right">
                            <label class="text-[10px] text-gray-400 block mb-1">Дата просмотра</label>
                            <input type="date" v-model="homeDate" class="bg-white border text-gray-700 text-xs rounded-lg p-1.5 shadow-sm">
                        </div>
                    </div>

                    <div class="space-y-2">
                        <div v-if="washes.length === 0" class="text-center py-8 text-gray-400 bg-white rounded-xl border border-dashed">
                            <i class="fas fa-clipboard-list text-2xl mb-2 opacity-50"></i><p class="text-sm">Нет записей</p>
                        </div>
                        <div v-for="wash in washes" :key="wash.id" class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center group relative">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center text-blue-600">
                                    <i class="fas fa-car"></i>
                                </div>
                                <div>
                                    <p class="font-bold text-gray-800 text-sm">{{ wash.carModel || 'Авто без названия' }}</p>
                                    <p class="text-xs text-gray-500">{{ wash.description }} <span v-if="user.role==='admin'" class="bg-gray-100 px-1 rounded ml-1">{{ wash.worker_name }}</span></p>
                                </div>
                            </div>
                            
                            <div class="flex items-center gap-4">
                                <span class="font-bold text-lg text-gray-700">+{{ formatMoney(wash.price) }}</span>
                                <div class="flex gap-2">
                                    <button @click="openWashModal(wash)" class="w-8 h-8 rounded-full bg-gray-100 text-blue-500 hover:bg-blue-100 flex items-center justify-center transition"><i class="fas fa-pen text-xs"></i></button>
                                    <button @click="deleteWash(wash.id)" class="w-8 h-8 rounded-full bg-gray-100 text-red-500 hover:bg-red-100 flex items-center justify-center transition"><i class="fas fa-trash text-xs"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div v-if="currentTab === 'reports'" class="max-w-5xl mx-auto animate-fade-in">
                    <div class="bg-white p-6 rounded-2xl shadow-md mb-6 border border-gray-100">
                        <h3 class="font-bold text-gray-800 mb-4">Фильтр по датам</h3>
                        <div class="flex flex-col md:flex-row gap-4 items-end">
                            <div class="w-full">
                                <label class="text-xs text-gray-500 mb-1 block">Начало</label>
                                <input type="date" v-model="reportDates.start" class="w-full border p-2.5 rounded-lg bg-gray-50">
                            </div>
                            <div class="w-full">
                                <label class="text-xs text-gray-500 mb-1 block">Конец</label>
                                <input type="date" v-model="reportDates.end" class="w-full border p-2.5 rounded-lg bg-gray-50">
                            </div>
                            <button @click="fetchData" class="w-full md:w-auto bg-slate-800 text-white px-6 py-2.5 rounded-lg hover:bg-slate-700">Обновить</button>
                        </div>
                    </div>

                    <div v-if="user.role === 'admin'" class="space-y-4">
                        <div class="bg-gradient-to-r from-slate-800 to-slate-900 text-white p-6 rounded-2xl shadow-xl">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-slate-400 text-sm mb-1">Чистая прибыль</p>
                                    <h2 class="text-4xl font-bold text-green-400">{{ formatMoney(stats.netProfit) }}</h2>
                                </div>
                                <div class="text-right text-sm text-slate-300">
                                    <p>Выручка: <span class="text-white">{{ formatMoney(stats.totalRevenue) }}</span></p>
                                    <p>Расходы: <span class="text-red-400">{{ formatMoney(stats.totalExpenses) }}</span></p>
                                    <p>ЗП: <span class="text-blue-300">{{ formatMoney(stats.totalRevenue / 2) }}</span></p>
                                </div>
                            </div>
                        </div>
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                            <h4 class="font-bold text-gray-700 mb-4 border-b pb-2">Зарплаты</h4>
                            <table class="w-full text-sm text-left">
                                <thead class="text-xs text-gray-500 uppercase bg-gray-50">
                                    <tr><th class="px-4 py-3">Сотрудник</th><th class="px-4 py-3 text-right">Намыл</th><th class="px-4 py-3 text-right">ЗП (50%)</th></tr>
                                </thead>
                                <tbody>
                                    <tr v-for="(amt, name) in stats.workerBreakdown" :key="name" class="border-b last:border-0">
                                        <td class="px-4 py-3 font-medium">{{ name }}</td>
                                        <td class="px-4 py-3 text-right text-gray-500">{{ formatMoney(amt) }}</td>
                                        <td class="px-4 py-3 text-right font-bold text-blue-600">{{ formatMoney(amt / 2) }}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div v-if="currentTab === 'users' && user.role === 'admin'" class="max-w-5xl mx-auto animate-fade-in">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold">Сотрудники</h2>
                        <button @click="openUserModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg shadow hover:bg-blue-700"><i class="fas fa-plus mr-2"></i>Добавить</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div v-for="u in usersList" :key="u.id" class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 relative group">
                            <div class="absolute top-3 right-3" v-if="u.username !== 'admin'">
                                <button @click="openUserModal(u)" class="text-blue-500 mr-2"><i class="fas fa-pen"></i></button>
                                <button @click="deleteUser(u.id)" class="text-red-400"><i class="fas fa-trash"></i></button>
                            </div>
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-full flex items-center justify-center text-white font-bold" :class="u.role==='admin'?'bg-slate-700':'bg-blue-500'">{{ u.name[0] }}</div>
                                <div><h3 class="font-bold text-lg">{{ u.name }}</h3><p class="text-xs text-gray-500">{{ u.role }}</p></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div v-if="currentTab === 'expenses'" class="max-w-5xl mx-auto animate-fade-in">
                    <div class="bg-white p-5 rounded-2xl shadow-sm mb-4 border border-gray-100">
                        <h3 class="font-bold mb-3">Добавить расход</h3>
                        <div class="grid grid-cols-1 md:grid-cols-12 gap-3">
                             <div class="md:col-span-2"><input type="date" v-model="newExpense.date" class="w-full border p-2 rounded-lg bg-gray-50 text-sm"></div>
                             <div class="md:col-span-7"><input v-model="newExpense.title" placeholder="Название" class="w-full border p-2 rounded-lg bg-gray-50 text-sm"></div>
                             <div class="md:col-span-3 flex gap-2">
                                <input v-model.number="newExpense.amount" type="number" placeholder="Сумма" class="w-full border p-2 rounded-lg bg-gray-50 text-sm">
                                <button @click="addExpense" class="bg-red-500 text-white px-4 rounded-lg"><i class="fas fa-plus"></i></button>
                             </div>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <div v-for="exp in expenses" class="bg-white p-3 rounded-lg shadow-sm border-l-4 border-red-500 flex justify-between items-center">
                            <div><p class="font-bold text-sm">{{ exp.title }}</p><p class="text-[10px] text-gray-400">{{ formatDate(exp.date_only) }}</p></div>
                            <span class="font-bold text-red-500 text-sm">-{{ formatMoney(exp.amount) }}</span>
                        </div>
                    </div>
                </div>
            </div>

            <nav class="md:hidden absolute bottom-0 w-full bg-white border-t border-gray-200 flex justify-around py-3 pb-safe z-20 shadow-lg">
                <button @click="currentTab='home'" :class="currentTab==='home'?'text-blue-600':'text-gray-400'" class="flex flex-col items-center"><i class="fas fa-home text-xl"></i><span class="text-[10px]">Главная</span></button>
                <button @click="currentTab='reports'" :class="currentTab==='reports'?'text-blue-600':'text-gray-400'" class="flex flex-col items-center"><i class="fas fa-chart-pie text-xl"></i><span class="text-[10px]">Отчеты</span></button>
                <button v-if="user.role==='admin'" @click="currentTab='users'" :class="currentTab==='users'?'text-blue-600':'text-gray-400'" class="flex flex-col items-center"><i class="fas fa-users text-xl"></i><span class="text-[10px]">Люди</span></button>
                <button v-if="user.role==='admin'" @click="currentTab='expenses'" :class="currentTab==='expenses'?'text-red-500':'text-gray-400'" class="flex flex-col items-center"><i class="fas fa-receipt text-xl"></i><span class="text-[10px]">Расходы</span></button>
            </nav>
        </main>
    </template>

    <div v-if="showUserModal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-2xl w-full max-w-sm shadow-2xl">
            <h3 class="font-bold text-xl mb-4">{{ editingUser.id ? 'Редактировать' : 'Новый' }}</h3>
            <div class="space-y-3">
                <input v-model="editingUser.name" placeholder="Имя" class="w-full border p-2 rounded">
                <input v-model="editingUser.username" placeholder="Логин" class="w-full border p-2 rounded">
                <input v-model="editingUser.password" placeholder="Пароль" class="w-full border p-2 rounded">
                <select v-model="editingUser.role" class="w-full border p-2 rounded"><option value="worker">Мойщик</option><option value="admin">Админ</option></select>
            </div>
            <div class="mt-6 flex gap-3"><button @click="showUserModal=false" class="w-1/2 py-2 bg-gray-100 rounded">Отмена</button><button @click="saveUser" class="w-1/2 py-2 bg-blue-600 text-white rounded">Сохранить</button></div>
        </div>
    </div>

    <div v-if="showWashModal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-2xl w-full max-w-sm shadow-2xl border-t-8 border-blue-500">
            <h3 class="font-bold text-xl mb-4 text-gray-800">Редактировать запись</h3>
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-gray-500">Дата</label>
                    <input type="date" v-model="editingWash.date_only" class="w-full border p-2 rounded-lg bg-gray-50">
                </div>
                
                <div v-if="user.role === 'admin'">
                    <label class="text-xs text-gray-500">Сотрудник</label>
                    <select v-model="editingWash.user_id" class="w-full border p-2 rounded-lg bg-gray-50 font-bold text-blue-800">
                        <option v-for="u in usersList" :key="u.id" :value="u.id">{{ u.name }}</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-2">
                     <div>
                        <label class="text-xs text-gray-500">Марка</label>
                        <input v-model="editingWash.car_model" class="w-full border p-2 rounded-lg bg-gray-50">
                     </div>
                     <div>
                        <label class="text-xs text-gray-500">Услуга</label>
                        <input v-model="editingWash.description" class="w-full border p-2 rounded-lg bg-gray-50">
                     </div>
                </div>

                <div>
                    <label class="text-xs text-gray-500">Цена</label>
                    <input type="number" v-model.number="editingWash.price" class="w-full border border-blue-200 p-2 rounded-lg text-lg font-bold">
                </div>
            </div>
            <div class="mt-6 flex gap-3">
                <button @click="showWashModal=false" class="w-1/2 py-2.5 bg-gray-100 rounded-lg">Отмена</button>
                <button @click="saveWash" class="w-1/2 py-2.5 bg-blue-600 text-white font-bold rounded-lg shadow-lg">Сохранить</button>
            </div>
        </div>
    </div>

</div>

<script>
    const { createApp, ref, computed, onMounted, watch } = Vue;

    createApp({
        setup() {
            const getLocalToday = () => {
                const d = new Date();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${d.getFullYear()}-${m}-${day}`;
            };
            const today = getLocalToday();

            const user = ref(null);
            const loginForm = ref({ username: '', password: '' });
            const loginError = ref('');
            
            const savedTab = localStorage.getItem('cw_current_tab') || 'home';
            const currentTab = ref(savedTab);
            const homeDate = ref(today); 
            const savedReportDates = JSON.parse(localStorage.getItem('cw_report_dates') || '{}');
            const reportDates = ref({ start: savedReportDates.start || today, end: savedReportDates.end || today });

            const washes = ref([]);
            const expenses = ref([]);
            const usersList = ref([]);
            const dateLabel = ref('Сегодня');
            const todayStats = ref({ totalRevenue: 0 });

            const newEntry = ref({ date: today, price: '', carModel: '', description: '', selectedWorkerId: null });
            const newExpense = ref({ date: today, title: '', amount: '' });

            const showUserModal = ref(false);
            const editingUser = ref({});
            
            // НОВЫЕ ПЕРЕМЕННЫЕ ДЛЯ РЕДАКТИРОВАНИЯ
            const showWashModal = ref(false);
            const editingWash = ref({});

            const api = async (act, body = {}) => {
                try {
                    const url = `http://localhost:8080/api?action=${act}`;
                    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                    if(!res.ok) throw new Error("Server error");
                    return await res.json();
                } catch (e) {
                    console.error("API Error:", e);
                    return { success: false };
                }
            };

            const fetchData = async () => {
                let start, end;
                if (currentTab.value === 'home') {
                    start = homeDate.value; end = homeDate.value;
                    dateLabel.value = (start === today) ? 'Сегодня' : start.split('-').reverse().join('.');
                } else {
                    start = reportDates.value.start; end = reportDates.value.end;
                    dateLabel.value = (start === end) ? start.split('-').reverse().join('.') : `${start} / ${end}`;
                }

                const res = await api('get_report', { start: start, end: end, user_id: user.value.id, role: user.value.role });
                washes.value = res.washes || [];
                expenses.value = res.expenses || [];

                if (start === today && currentTab.value === 'home') {
                    const rev = washes.value.reduce((acc, w) => acc + Number(w.price), 0);
                    todayStats.value.totalRevenue = rev;
                }
            };

            const fetchUsers = async () => {
                const res = await api('get_users');
                usersList.value = res || [];
            };

            const initialize = async () => {
                if(user.value.role === 'admin') await fetchUsers();
                newEntry.value.selectedWorkerId = user.value.id;
                fetchData();
            };

            const login = async () => {
                const res = await api('login', loginForm.value);
                if (res.success) { user.value = res.user; localStorage.setItem('cw_user', JSON.stringify(res.user)); initialize(); }
                else { loginError.value = res.message || "Ошибка"; }
            };
            const logout = () => { user.value = null; localStorage.removeItem('cw_user'); currentTab.value = 'home'; };

            const addWash = async () => {
                if(!newEntry.value.price) return;
                const workerId = newEntry.value.selectedWorkerId || user.value.id;
                await api('add_wash', { ...newEntry.value, user_id: workerId });
                newEntry.value.price = ''; newEntry.value.carModel = ''; newEntry.value.description = '';
                fetchData();
            };

            // --- НОВЫЕ ФУНКЦИИ РЕДАКТИРОВАНИЯ И УДАЛЕНИЯ ---
            const openWashModal = (wash) => {
                // Копируем объект, чтобы не менять напрямую в списке
                editingWash.value = { ...wash, date: wash.date_only }; 
                showWashModal.value = true;
            };

            const saveWash = async () => {
                // Отправляем date_only как date
                await api('edit_wash', { ...editingWash.value, date: editingWash.value.date_only });
                showWashModal.value = false;
                fetchData(); // Обновляем список
            };

            const deleteWash = async (id) => {
                if(confirm('Удалить эту запись? Отменить действие нельзя.')) {
                    await api('delete_wash', { id });
                    fetchData();
                }
            };

            const addExpense = async () => {
                if(!newExpense.value.amount) return;
                await api('add_expense', { ...newExpense.value });
                newExpense.value.title = ''; newExpense.value.amount = '';
                fetchData();
            };

            const openUserModal = (u = null) => {
                editingUser.value = u ? { ...u, password: '' } : { name: '', username: '', password: '', role: 'worker', is_active: 1 };
                showUserModal.value = true;
            };
            const saveUser = async () => { await api('save_user', editingUser.value); showUserModal.value = false; fetchUsers(); };
            const deleteUser = async (id) => { if(confirm('В архив?')) await api('delete_user', { id }); fetchUsers(); };

            const stats = computed(() => {
                const rev = washes.value.reduce((acc, w) => acc + Number(w.price), 0);
                const exp = expenses.value.reduce((acc, e) => acc + Number(e.amount), 0);
                const workerBreakdown = {};
                if(user.value && user.value.role === 'admin') {
                    washes.value.forEach(w => {
                        const name = w.worker_name || 'Неизвестно';
                        workerBreakdown[name] = (workerBreakdown[name] || 0) + Number(w.price);
                    });
                }
                return { totalRevenue: rev, totalExpenses: exp, myEarnings: rev / 2, netProfit: (rev / 2) - exp, workerBreakdown };
            });

            const formatMoney = (v) => new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB', maximumFractionDigits:0 }).format(v);
            const formatDate = (d) => { if(!d) return ''; return new Date(d).toLocaleDateString('ru-RU'); };

            onMounted(() => {
                const saved = localStorage.getItem('cw_user');
                if(saved) { user.value = JSON.parse(saved); initialize(); }
            });

            watch(currentTab, (newTab) => {
                localStorage.setItem('cw_current_tab', newTab);
                fetchData();
                if(newTab === 'users') fetchUsers();
            });
            watch(reportDates, (newDates) => { if (currentTab.value === 'reports') { localStorage.setItem('cw_report_dates', JSON.stringify(newDates)); fetchData(); } }, { deep: true });
            watch(homeDate, (newDate) => { if (currentTab.value === 'home') { newEntry.value.date = newDate; fetchData(); } });

            return { 
                user, loginForm, loginError, login, logout, currentTab, 
                washes, expenses, usersList, newEntry, newExpense, 
                homeDate, reportDates, dateLabel, todayStats,
                showUserModal, editingUser, openUserModal, saveUser, deleteUser,
                showWashModal, editingWash, openWashModal, saveWash, deleteWash, // <-- Return new logic
                addWash, addExpense, fetchData, stats, formatMoney, formatDate 
            };
        }
    }).mount('#app');
</script>
</body>
</html>
