<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GUMS CarWash</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Manrope', 'sans-serif'] }, colors: { primary: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a' } } } }
        }
    </script>
    <style>
        body { background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .custom-scroll::-webkit-scrollbar { width: 0px; height: 0px; }
        .custom-scroll { scrollbar-width: none; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="date"]::-webkit-calendar-picker-indicator { opacity: 0; position: absolute; left: 0; top: 0; width: 100%; height: 100%; cursor: pointer; }
        .fade-enter-active, .fade-leave-active { transition: opacity 0.3s ease; }
        .fade-enter-from, .fade-leave-to { opacity: 0; }
        .slide-up-enter-active { transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .slide-up-enter-from { transform: translateY(20px); opacity: 0; }
        .pb-safe { padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
        .pt-safe { padding-top: env(safe-area-inset-top); }
    </style>
</head>
<body class="text-slate-800 antialiased h-screen flex flex-col overflow-hidden bg-slate-50">

<div id="app" class="h-full flex flex-col md:flex-row relative">

    <transition-group name="slide-up" tag="div" class="fixed top-4 right-4 z-[9999] space-y-2 pointer-events-none w-full max-w-xs px-4 md:px-0">
        <div v-for="t in toasts" :key="t.id" class="bg-white/90 backdrop-blur border shadow-xl rounded-2xl p-4 flex items-center gap-3 pointer-events-auto" :class="t.type==='error'?'border-red-100 text-red-600':'border-blue-100 text-blue-700'">
            <i :class="t.type==='error'?'fas fa-circle-exclamation':'fas fa-circle-check'" class="text-xl"></i>
            <div><p class="font-bold text-sm">{{ t.title }}</p><p class="text-xs opacity-80">{{ t.msg }}</p></div>
        </div>
    </transition-group>

    <transition name="fade">
        <div v-if="confirmState.show" class="fixed inset-0 z-[100] bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl">
                <h3 class="text-xl font-bold text-center mb-2">Вы уверены?</h3>
                <p class="text-center text-slate-500 text-sm mb-6">{{ confirmState.message }}</p>
                <div class="grid grid-cols-2 gap-3"><button @click="confirmState.show=false" class="py-3 bg-slate-100 font-bold rounded-xl text-slate-600">Отмена</button><button @click="confirmState.action()" class="py-3 bg-red-500 text-white font-bold rounded-xl shadow-lg shadow-red-500/30">Да</button></div>
            </div>
        </div>
    </transition>

    <transition name="fade">
        <div v-if="showProfileModal" class="fixed inset-0 z-[60] bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
            <div class="bg-white p-8 rounded-3xl w-full max-w-sm shadow-2xl">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-extrabold text-xl text-slate-800">Мой профиль</h3>
                    <button @click="showProfileModal=false" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 block pl-1">Имя (нельзя изменить)</label>
                        <input :value="profileForm.name" disabled class="w-full bg-slate-100 text-slate-400 border-0 rounded-xl p-3 font-semibold cursor-not-allowed">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 block pl-1">Логин</label>
                        <input v-model="profileForm.username" class="w-full bg-slate-50 border-0 rounded-xl p-3 font-semibold outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 block pl-1">Новый пароль</label>
                        <input v-model="profileForm.password" placeholder="Оставьте пустым, если не меняете" class="w-full bg-slate-50 border-0 rounded-xl p-3 font-semibold outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div class="mt-8 flex gap-3"><button @click="showProfileModal=false" class="w-1/2 py-3 bg-slate-100 rounded-xl font-bold text-slate-600 hover:bg-slate-200 transition">Отмена</button><button @click="saveProfile" class="w-1/2 py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 shadow-lg transition">Сохранить</button></div>
            </div>
        </div>
    </transition>

    <div v-if="!user" class="fixed inset-0 z-50 bg-slate-900 flex items-center justify-center p-6 bg-[url('https://images.unsplash.com/photo-1601362840469-51e4d8d58785?q=80&w=2070')] bg-cover">
        <div class="absolute inset-0 bg-slate-900/80 backdrop-blur-sm"></div>
        <div class="bg-white/10 backdrop-blur-md border border-white/20 p-8 rounded-3xl w-full max-w-sm shadow-2xl relative">
            <div class="text-center mb-8"><h1 class="text-4xl font-extrabold text-white">GUMS</h1><p class="text-blue-200 text-sm">CarWash</p></div>
            <input v-model="loginForm.username" placeholder="Логин" class="w-full mb-3 py-4 px-4 bg-white/10 border border-white/10 rounded-xl text-white placeholder-white/50 focus:bg-white/20 outline-none transition">
            <input v-model="loginForm.password" type="password" placeholder="Пароль" class="w-full mb-6 py-4 px-4 bg-white/10 border border-white/10 rounded-xl text-white placeholder-white/50 focus:bg-white/20 outline-none transition">
            <button @click="login" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-600/40 hover:bg-blue-500 active:scale-95 transition">Войти</button>
            <p v-if="loginError" class="text-red-300 text-center mt-4 text-sm">{{ loginError }}</p>
        </div>
    </div>

    <template v-else>
        
        <aside class="hidden md:flex w-72 flex-col bg-white border-r border-slate-200 z-20">
            <div class="p-8 pb-4">
                <h2 class="text-2xl font-extrabold text-slate-900">GUMS</h2>
                <div @click="openProfileModal" class="mt-4 flex items-center gap-3 bg-slate-50 p-3 rounded-xl border border-slate-100 cursor-pointer hover:bg-slate-100 transition group">
                    <div class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold shadow-md group-hover:scale-105 transition">{{ user.name[0] }}</div>
                    <div>
                        <p class="text-sm font-bold text-slate-800">{{ user.name }}</p>
                        <p class="text-[10px] uppercase font-bold text-blue-500">Профиль <i class="fas fa-cog ml-1"></i></p>
                    </div>
                </div>
            </div>
            <nav class="flex-1 px-4 space-y-1 mt-4">
                <a v-for="tab in tabs" :key="tab.id" @click="canAccess(tab) ? currentTab = tab.id : null" v-show="canAccess(tab)" 
                   :class="currentTab === tab.id ? 'bg-blue-50 text-blue-700 font-bold' : 'text-slate-500 hover:bg-slate-50'" 
                   class="flex items-center gap-4 px-4 py-3.5 rounded-xl cursor-pointer transition">
                    <i :class="tab.icon" class="w-5 text-center"></i> {{ tab.label }}
                </a>
            </nav>
            <div class="p-4"><button @click="logout" class="w-full py-3 rounded-xl text-slate-400 hover:text-red-500 font-medium transition">Выход</button></div>
        </aside>

        <main class="flex-1 flex flex-col h-full overflow-hidden relative">
            
            <header class="md:hidden bg-white/80 backdrop-blur-md p-4 pt-safe flex justify-between items-center shadow-sm z-30 sticky top-0">
                <div class="flex items-center gap-3" @click="openProfileModal">
                    <div class="w-9 h-9 bg-blue-600 rounded-lg text-white flex items-center justify-center shadow-blue-500/30 font-bold">{{ user.name[0] }}</div>
                    <div>
                        <h1 class="font-bold text-slate-900 leading-none">GUMS</h1>
                        <p class="text-[10px] font-bold text-blue-500 uppercase mt-1 flex items-center gap-1">Профиль <i class="fas fa-cog"></i></p>
                    </div>
                </div>
                <button @click="logout" class="w-9 h-9 rounded-full bg-slate-50 text-slate-400 flex items-center justify-center"><i class="fas fa-sign-out-alt"></i></button>
            </header>

            <div class="flex-1 overflow-y-auto custom-scroll p-4 md:p-8 pb-safe md:pb-8 relative">
                
                <transition name="fade" mode="out-in">
                <div v-if="currentTab === 'home'" key="home" class="max-w-6xl mx-auto">
                    
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="bg-slate-900 p-5 rounded-2xl shadow-xl text-white relative overflow-hidden">
                            <p class="text-[10px] md:text-xs text-slate-400 font-bold uppercase tracking-wider mb-1">Выручка ({{ fancyDateLabel }})</p>
                            <p class="text-2xl md:text-3xl font-extrabold">{{ formatMoney(stats.totalRevenue) }}</p>
                        </div>
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                             <p class="text-[10px] md:text-xs text-slate-400 font-bold uppercase tracking-wider mb-1">{{ user.role === 'admin' ? 'Остаток кассы (без ЗП)' : 'Мой заработок' }}</p>
                             <p class="text-2xl md:text-3xl font-extrabold text-blue-600">{{ formatMoney(stats.myEarnings) }}</p>
                        </div>
                    </div>

                    <div v-if="user.role === 'admin'" class="bg-white rounded-3xl shadow-lg shadow-slate-200/50 p-6 mb-8 border border-slate-100 relative overflow-visible">
                        <div class="absolute top-0 left-0 w-1 h-full bg-blue-500 rounded-l-3xl"></div>
                        <h3 class="font-bold text-lg text-slate-800 mb-5 flex items-center gap-2"><i class="fas fa-plus-circle text-blue-500"></i> Добавить авто</h3>
                        
                        <div class="grid grid-cols-1 md:grid-cols-12 gap-5">
                            <div class="md:col-span-4 space-y-4">
                                <div class="grid grid-cols-2 gap-3">
                                    <div>
                                        <label class="text-[10px] uppercase font-bold text-slate-400 tracking-wider mb-1 block pl-1">Дата</label>
                                        <div class="relative"><input type="date" v-model="newEntry.date" @change="$event.target.blur()" class="w-full bg-slate-50 border-0 rounded-xl px-4 py-3 text-sm font-semibold focus:ring-2 focus:ring-blue-500 outline-none appearance-none cursor-pointer"><div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400"><i class="fas fa-calendar-day"></i></div></div>
                                    </div>
                                    <div>
                                        <label class="text-[10px] uppercase font-bold text-slate-400 tracking-wider mb-1 block pl-1">Марка авто</label>
                                        <input v-model="newEntry.carModel" placeholder="BMW" class="w-full bg-slate-50 border-0 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                                    </div>
                                </div>

                                <div>
                                    <label class="text-[10px] uppercase font-bold text-slate-400 tracking-wider mb-1 block pl-1">Основой мойщик</label>
                                    <div class="relative">
                                        <select v-model="newEntry.selectedWorkerId" class="w-full bg-slate-50 border-0 rounded-xl pl-4 pr-10 py-3 text-sm font-bold text-slate-700 focus:ring-2 focus:ring-blue-500 outline-none appearance-none cursor-pointer">
                                            <option :value="user.id">Я ({{ user.name }})</option>
                                            <option v-for="u in selectableWorkers.filter(u=>u.id!==user.id)" :key="u.id" :value="u.id">{{ u.name }}</option>
                                        </select>
                                        <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400"><i class="fas fa-chevron-down text-xs"></i></div>
                                    </div>
                                </div>
                                
                                <div>
                                    <label class="text-[10px] uppercase font-bold text-slate-400 tracking-wider mb-1 block pl-1 text-blue-500"><i class="fas fa-user-friends"></i> Напарник (Делят 50/50)</label>
                                    <div class="relative border border-blue-100 rounded-xl bg-blue-50/50">
                                        <select v-model="newEntry.coWorkerId" class="w-full bg-transparent border-0 rounded-xl pl-4 pr-10 py-3 text-sm font-bold text-blue-700 focus:ring-2 focus:ring-blue-500 outline-none appearance-none cursor-pointer">
                                            <option :value="null">Без напарника (Мыли один)</option>
                                            <option v-for="u in selectableWorkers.filter(u=>u.id!==newEntry.selectedWorkerId)" :key="u.id" :value="u.id">{{ u.name }}</option>
                                        </select>
                                        <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-blue-400"><i class="fas fa-chevron-down text-xs"></i></div>
                                    </div>
                                </div>
                            </div>

                            <div class="md:col-span-8 flex flex-col justify-between">
                                <div>
                                    <label class="text-[10px] uppercase font-bold text-slate-400 tracking-wider mb-2 block pl-1">Услуги (Можно выбрать несколько)</label>
                                    <div class="flex flex-wrap gap-2 mb-3">
                                        <button v-for="s in servicesList" :key="s.id" @click="toggleService(s)" 
                                                class="px-4 py-2 rounded-xl text-sm font-bold transition-all border shadow-sm"
                                                :class="selectedServices.some(item=>item.id===s.id) ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-600 border-slate-200 hover:border-blue-300'">
                                            {{ s.name }} <span class="text-[10px] opacity-80 font-normal ml-1">{{ s.price }}₽</span>
                                        </button>
                                        <button @click="toggleCustomService" class="px-4 py-2 rounded-xl text-sm font-bold border border-dashed transition-all"
                                                :class="customServiceMode ? 'bg-slate-800 text-white border-slate-800' : 'bg-transparent text-slate-500 border-slate-300 hover:border-slate-500'">
                                            + Своя услуга
                                        </button>
                                    </div>
                                    
                                    <input v-if="customServiceMode" v-model="customServiceText" @input="updateDescription" placeholder="Напишите название услуги" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none mb-3">
                                    <p class="text-xs text-slate-500 font-medium pl-1 mb-4 leading-tight">Итоговая услуга: <span class="text-blue-600 font-bold">{{ newEntry.description || 'Не выбрана' }}</span></p>
                                </div>

                                <div>
                                    <label class="text-[10px] uppercase font-bold text-slate-400 tracking-wider mb-1 block pl-1">Базовая Сумма</label>
                                    <div class="flex gap-3">
                                        <div class="relative w-full">
                                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold">₽</span>
                                            <input type="number" v-model.number="newEntry.price" placeholder="0" class="w-full bg-white border-2 border-slate-200 rounded-xl pl-8 pr-4 py-3 text-xl font-extrabold text-slate-800 focus:border-blue-500 focus:ring-0 outline-none transition shadow-inner">
                                        </div>
                                        <button type="button" @click="addWash" :disabled="!newEntry.price || !newEntry.description" class="bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:bg-slate-400 text-white w-16 rounded-xl shadow-lg shadow-blue-500/30 flex items-center justify-center transition active:scale-95 shrink-0">
                                            <i class="fas fa-check text-2xl"></i>
                                        </button>
                                    </div>
                                    
                                    <div class="mt-3 flex items-center gap-2 pl-1">
                                        <input type="checkbox" id="is_free_cb" v-model="newEntry.is_free" class="w-4 h-4 text-blue-600 rounded cursor-pointer">
                                        <label for="is_free_cb" class="text-[11px] font-bold text-slate-500 cursor-pointer leading-tight">
                                            Сделать бесплатной для клиента<br>
                                            <span class="text-red-400 font-medium">ЗП начисляется из кассы</span>
                                        </label>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center justify-between mb-4">
                        <h3 class="font-bold text-slate-700 text-lg">Лента моек</h3>
                        <div class="flex items-center bg-white rounded-xl shadow-sm border border-slate-200 p-1">
                            <button @click="changeDay(-1)" class="w-9 h-9 flex items-center justify-center rounded-lg hover:bg-slate-50 text-slate-400 hover:text-blue-600 transition"><i class="fas fa-chevron-left"></i></button>
                            <div class="relative px-3 min-w-[100px] text-center">
                                <span class="text-sm font-bold text-slate-700 block">{{ fancyDateLabel }}</span>
                                <input type="date" v-model="homeDate" @change="$event.target.blur()" class="absolute inset-0 opacity-0 cursor-pointer">
                            </div>
                            <button @click="changeDay(1)" class="w-9 h-9 flex items-center justify-center rounded-lg hover:bg-slate-50 text-slate-400 hover:text-blue-600 transition"><i class="fas fa-chevron-right"></i></button>
                        </div>
                    </div>

                    <div class="space-y-3">
                        <div v-if="washes.length === 0" class="text-center py-10 text-slate-300 bg-white rounded-3xl border border-dashed border-slate-200">
                            <i class="fas fa-soap text-4xl mb-2 opacity-50"></i><p class="text-sm font-medium">Нет записей</p>
                        </div>

                        <transition-group name="slide-up">
                        <div v-for="w in washes" :key="w.id" class="group bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row md:items-center justify-between gap-3 hover:border-blue-100 transition">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-2xl bg-slate-50 text-slate-400 flex items-center justify-center shrink-0">
                                    <i class="fas fa-car-side text-lg" :class="w.co_worker_name ? 'text-indigo-400' : ''"></i>
                                </div>
                                <div>
                                    <p class="font-bold text-slate-800">{{ w.car_model || 'Авто' }}</p>
                                    <p class="text-xs font-medium text-slate-500 mt-0.5 leading-tight">{{ w.description }}</p>
                                    <div class="flex items-center gap-1 mt-1.5 flex-wrap">
                                        <span class="text-[10px] font-bold text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded flex items-center gap-1"><i class="fas fa-user"></i> {{ w.worker_name }}</span>
                                        <span v-if="w.co_worker_name" class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-1.5 py-0.5 rounded flex items-center gap-1"><i class="fas fa-hands-helping"></i> {{ w.co_worker_name }}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="flex items-center justify-between md:justify-end gap-4 border-t md:border-t-0 pt-2 md:pt-0">
                                
                                <div class="text-left md:text-right">
                                    <div v-if="w.is_free" class="flex flex-col items-start md:items-end">
                                        <span class="text-[10px] font-bold text-red-500 uppercase tracking-wider bg-red-50 px-2 py-0.5 rounded mb-1">Бесплатно</span>
                                        <div class="flex items-center gap-2">
                                            <span class="text-sm font-medium text-slate-400 line-through">{{ formatMoney(w.price) }}</span>
                                            <span class="font-extrabold text-lg text-slate-700 leading-none">+0 ₽</span>
                                        </div>
                                    </div>
                                    <span v-else class="font-extrabold text-lg text-slate-700 block leading-none">+{{ formatMoney(w.price) }}</span>
                                    
                                    <span v-if="user.role === 'worker'" class="text-[10px] text-slate-400 font-medium mt-1 block">Моя доля: {{ formatMoney(w.co_worker_name ? w.price / 4 : w.price / 2) }}</span>
                                </div>

                                <div class="flex gap-2" v-if="user.role === 'admin'">
                                    <button @click="openWashModal(w)" class="w-8 h-8 rounded-full bg-slate-50 text-slate-400 hover:text-blue-600"><i class="fas fa-pen text-xs"></i></button>
                                    <button @click="deleteWash(w.id)" class="w-8 h-8 rounded-full bg-slate-50 text-slate-400 hover:text-red-500"><i class="fas fa-trash text-xs"></i></button>
                                </div>
                            </div>
                        </div>
                        </transition-group>
                    </div>
                </div>
                </transition>

                <transition name="fade" mode="out-in">
                <div v-if="currentTab === 'reports'" key="reports" class="max-w-5xl mx-auto">
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 mb-6">
                        <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2"><i class="fas fa-filter text-blue-500"></i> Фильтр по датам</h3>
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                            <div class="relative"><label class="text-[10px] uppercase font-bold text-slate-400 mb-1 block">Начало</label><input type="date" v-model="reportDates.start" @change="$event.target.blur()" class="w-full bg-slate-50 border-0 rounded-xl p-3 text-sm font-semibold"></div>
                            <div class="relative"><label class="text-[10px] uppercase font-bold text-slate-400 mb-1 block">Конец</label><input type="date" v-model="reportDates.end" @change="$event.target.blur()" class="w-full bg-slate-50 border-0 rounded-xl p-3 text-sm font-semibold"></div>
                            <div class="relative" v-if="user.role === 'admin'">
                                <label class="text-[10px] uppercase font-bold text-slate-400 mb-1 block">Сотрудник</label>
                                <select v-model="reportFilterId" class="w-full bg-slate-50 border-0 rounded-xl p-3 text-sm font-bold text-slate-600 appearance-none">
                                    <option :value="0">Все сотрудники</option>
                                    <option v-for="u in usersList" :key="u.id" :value="u.id">{{ u.name }}</option>
                                </select>
                                <div class="absolute right-3 top-1/2 translate-y-1 pointer-events-none text-slate-400"><i class="fas fa-chevron-down text-xs"></i></div>
                            </div>
                            <button @click="loadData" class="w-full bg-slate-800 text-white font-bold py-3 rounded-xl shadow-lg hover:bg-slate-700 transition">Применить</button>
                        </div>
                    </div>
                    
                    <div v-if="user.role === 'admin'" class="space-y-6">
                        <div class="bg-slate-900 rounded-3xl p-8 shadow-2xl relative overflow-hidden text-white">

            const selectedServices = ref([]);
            const selectedService = ref(null); 
            const customServiceMode = ref(false);
            const customServiceText = ref('');

            const newExpense = ref({ date: today, title: '', amount: '' });
            
            const showProfileModal = ref(false);
            const profileForm = ref({ username: '', password: '', name: '' });

            const toasts = ref([]);
            const confirmState = ref({ show: false, message: '', action: () => {} });
            const showServiceModal = ref(false); const editingService = ref({});
            const showUserModal = ref(false); const editingUser = ref({});
            const showWashModal = ref(false); const editingWash = ref({});
            const showExpenseEditModal = ref(false); const editingExpense = ref({});

            const showToast = (title, msg, type = 'success') => { const id = Date.now(); toasts.value.push({ id, title, msg, type }); setTimeout(() => toasts.value = toasts.value.filter(t => t.id !== id), 3000); };
            const confirmAction = (msg, action) => { confirmState.value = { show: true, message: msg, action: () => { action(); confirmState.value.show = false; } }; };
            const api = async (action, data = {}) => { try { const res = await fetch(`${API_URL}?action=${action}`, { method: 'POST', body: JSON.stringify(data) }); return await res.json(); } catch(e) { showToast('Ошибка сети', 'Нет связи', 'error'); return { success: false }; } };

            const loadData = async () => {
                let start, end;
                if (currentTab.value === 'home') {
                    start = homeDate.value;
                    end = homeDate.value;
                } else if (currentTab.value === 'expenses') {
                    start = expenseDates.value.start;
                    end = expenseDates.value.end;
                } else {
                    start = reportDates.value.start;
                    end = reportDates.value.end;
                }
                
                const res = await api('get_report', { start, end, user_id: user.value.id, role: user.value.role, filter_id: reportFilterId.value });
                washes.value = res.washes || []; expenses.value = res.expenses || [];
            };

            const loadAux = async () => {
                usersList.value = await api('get_users') || [];
                servicesList.value = await api('get_services') || [];
            };

            const login = async () => {
                const res = await api('login', loginForm.value);
                if(res.success) { user.value = res.user; localStorage.setItem('cw_user', JSON.stringify(user.value)); loadAux(); loadData(); showToast('Успешно', `Привет, ${user.value.name}`); } 
                else loginError.value = "Неверный логин или пароль";
            };
            const logout = () => { user.value = null; localStorage.removeItem('cw_user'); };
            
            const openProfileModal = () => {
                profileForm.value = { id: user.value.id, username: user.value.username, password: '', name: user.value.name };
                showProfileModal.value = true;
            };
            const saveProfile = async () => {
                const res = await api('update_profile', profileForm.value);
                if(res.success) {
                    user.value.username = profileForm.value.username;
                    localStorage.setItem('cw_user', JSON.stringify(user.value));
                    showProfileModal.value = false;
                    showToast('Готово', 'Профиль обновлен');
                }
            };

            const changeDay = (offset) => { const d = new Date(homeDate.value); d.setDate(d.getDate() + offset); homeDate.value = d.toISOString().split('T')[0]; };
            
            const changeExpenseDay = (offset) => { 
                const d = new Date(expenseDates.value.start); 
                d.setDate(d.getDate() + offset); 
                const newDateStr = d.toISOString().split('T')[0];
                expenseDates.value.start = newDateStr;
                expenseDates.value.end = newDateStr;
                loadData(); 
            };

            const updateDescription = () => {
                let parts = selectedServices.value.map(s => s.name);
                if (customServiceMode.value && customServiceText.value) parts.push(customServiceText.value);
                newEntry.value.description = parts.join(' + ');
            };
            
            const toggleService = (s) => {
                const idx = selectedServices.value.findIndex(x => x.id === s.id);
                if (idx > -1) selectedServices.value.splice(idx, 1);
                else selectedServices.value.push(s);
                newEntry.value.price = selectedServices.value.reduce((sum, item) => sum + item.price, 0);
                updateDescription();
            };

            const toggleCustomService = () => {
                customServiceMode.value = !customServiceMode.value;
                if(!customServiceMode.value) customServiceText.value = '';
                updateDescription();
            };
            
            const onServiceChange = () => { if(selectedService.value === 'custom') { toggleCustomService(); selectedService.value = null; } };

            const addWash = async () => {
                if(!newEntry.value.price || !newEntry.value.description) return;
                const payload = {
                    user_id: newEntry.value.selectedWorkerId || user.value.id,
                    co_worker_id: newEntry.value.coWorkerId || null,
                    date: newEntry.value.date,
                    car_model: newEntry.value.carModel,
                    description: newEntry.value.description,
                    price: newEntry.value.price,
                    is_free: newEntry.value.is_free ? 1 : 0
                };
                await api('add_wash', payload);
                newEntry.value.price = ''; newEntry.value.carModel = ''; newEntry.value.description = ''; 
                newEntry.value.coWorkerId = null; newEntry.value.is_free = false;
                selectedServices.value = []; customServiceMode.value = false; customServiceText.value = '';
                showToast('Сохранено', 'Машина добавлена'); loadData();
            };

            const saveWash = async () => { await api('edit_wash', { ...editingWash.value, date: editingWash.value.date_only, is_free: editingWash.value.is_free ? 1 : 0 }); showWashModal.value = false; showToast('Обновлено', 'Запись изменена'); loadData(); };
            const deleteWash = (id) => confirmAction('Удалить эту запись безвозвратно?', async () => { await api('delete_wash', { id }); loadData(); });
            const saveService = async () => { await api('save_service', { id: editingService.value.id, service_name: editingService.value.name, service_price: editingService.value.price }); showServiceModal.value = false; loadAux(); };
            const deleteService = (id) => confirmAction('Архивировать эту услугу?', async () => { await api('delete_service', { id }); loadAux(); });
            const saveUser = async () => { await api('save_user', editingUser.value); showUserModal.value = false; loadAux(); };
            const deleteUser = (id) => confirmAction('Архивировать сотрудника?', async () => { await api('delete_user', { id }); loadAux(); });
            
            const addExpense = async () => { 
                if(!newExpense.value.amount) return; 
                await api('add_expense', { 
                    date: newExpense.value.date || today, 
                    title: newExpense.value.title || 'Прочий расход', 
                    amount: Number(newExpense.value.amount) 
                }); 
                newExpense.value.amount = ''; 
                newExpense.value.title = ''; 
                showToast('Расход', 'Записано'); 
                loadData(); 
            };

            const openExpenseEditModal = (e) => {
                editingExpense.value = { ...e };
                showExpenseEditModal.value = true;
            };

            const saveExpenseEdit = async () => {
                if(!editingExpense.value.amount || !editingExpense.value.title) return;
                await api('edit_expense', {
                    id: editingExpense.value.id,
                    title: editingExpense.value.title,
                    amount: Number(editingExpense.value.amount),
                    date: editingExpense.value.date_only
                });
                showExpenseEditModal.value = false;
                showToast('Обновлено', 'Расход изменен');
                loadData();
            };

            const deleteExpense = (id) => {
                confirmAction('Удалить этот расход?', async () => {
                    await api('delete_expense', { id });
                    loadData();
                });
            };

            const selectableWorkers = computed(() => usersList.value.filter(u => u.role === 'worker' || u.id === user.value.id));
            const fancyDateLabel = computed(() => { if(homeDate.value === today) return 'Сегодня'; const y = new Date(); y.setDate(y.getDate() - 1); if(homeDate.value === y.toISOString().split('T')[0]) return 'Вчера'; return homeDate.value.split('-').reverse().join('.'); });
            
            const fancyExpenseDateLabel = computed(() => { 
                if(expenseDates.value.start !== expenseDates.value.end) return 'Период';
                if(expenseDates.value.start === today) return 'Сегодня'; 
                const y = new Date(); y.setDate(y.getDate() - 1); 
                if(expenseDates.value.start === y.toISOString().split('T')[0]) return 'Вчера'; 
                return expenseDates.value.start.split('-').reverse().join('.'); 
            });

            const expensesTotal = computed(() => expenses.value.reduce((sum, item) => sum + item.amount, 0));

            // ГЛАВНАЯ ЛОГИКА РАСЧЕТОВ С УЧЕТОМ БЕСПЛАТНЫХ МОЕК
            const stats = computed(() => {
                let actualRevenue = 0;
                let totalPayroll = 0;
                const breakdown = {};
                
                washes.value.forEach(w => {
                    const basePrice = w.price;
                    
                    // Если не бесплатно, деньги идут в кассу
                    if (!w.is_free) {
                        actualRevenue += basePrice;
                    }
                    
                    // А вот зарплата мойщику считается от БАЗОВОЙ цены всегда
                    const pricePerWorker = w.co_worker_name ? basePrice / 2 : basePrice;
                    const workerShare = pricePerWorker / 2;
                    
                    breakdown[w.worker_name] = (breakdown[w.worker_name] || 0) + workerShare;
                    if (w.co_worker_name) {
                        breakdown[w.co_worker_name] = (breakdown[w.co_worker_name] || 0) + workerShare;
                    }
                    // Владелец всегда отдает 50% от прайса на зарплату
                    totalPayroll += (basePrice / 2);
                });
                
                const exp = expenses.value.reduce((a, b) => a + b.amount, 0);
                
                let workerEarnings = 0;
                if (user.value) {
                     workerEarnings = washes.value.reduce((sum, w) => {
                        if (w.user_id === user.value.id || w.co_worker_id === user.value.id) {
                            return sum + (w.co_worker_name ? w.price / 4 : w.price / 2);
                        }
                        return sum;
                    }, 0);
                }

                return { 
                    totalRevenue: actualRevenue, 
                    totalPayroll: totalPayroll,
                    totalExpenses: exp, 
                    netProfit: actualRevenue - totalPayroll - exp, 
                    myEarnings: user.value && user.value.role === 'admin' ? (actualRevenue - totalPayroll) : workerEarnings, 
                    workerBreakdown: breakdown 
                };
            });
            
            const formatMoney = (v) => new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB', maximumFractionDigits: 0 }).format(v);
            const formatDate = (v) => v ? new Date(v).toLocaleDateString('ru-RU') : '';

            const openServiceModal = (s=null) => { editingService.value = s ? {...s} : {}; showServiceModal.value = true; };
            const openUserModal = (u=null) => { editingUser.value = u ? {...u, password:''} : {role:'worker'}; showUserModal.value = true; };
            const openWashModal = (w) => { editingWash.value = {id: w.id, user_id: w.user_id, co_worker_id: w.co_worker_id, date_only: w.date_only, car_model: w.car_model, description: w.description, price: w.price, is_free: w.is_free === 1}; showWashModal.value = true; };

            onMounted(() => { const u = localStorage.getItem('cw_user'); if(u) { user.value = JSON.parse(u); loadAux(); loadData(); } });
            
            watch(currentTab, (v) => { localStorage.setItem('cw_tab', v); loadData(); });
            watch(homeDate, () => { if(currentTab.value==='home') { newEntry.value.date = homeDate.value; loadData(); } });
            watch(expenseDates, () => { localStorage.setItem('cw_exp_dates', JSON.stringify(expenseDates.value)); }, {deep: true});
            watch([reportDates, reportFilterId], () => { if(currentTab.value==='reports') { localStorage.setItem('cw_dates', JSON.stringify(reportDates.value)); loadData(); } }, {deep:true});

            return { 
                user, loginForm, loginError, login, logout, currentTab, tabs, canAccess, loadData,
                washes, expenses, usersList, servicesList, newEntry, newExpense, selectedService,
                homeDate, expenseDates, reportDates, reportFilterId, stats, expensesTotal, formatMoney, formatDate,
                showServiceModal, editingService, openServiceModal, saveService, deleteService,
                showUserModal, editingUser, openUserModal, saveUser, deleteUser,
                showWashModal, editingWash, openWashModal, saveWash, deleteWash,
                showProfileModal, profileForm, openProfileModal, saveProfile,
                showExpenseEditModal, editingExpense, openExpenseEditModal, saveExpenseEdit, deleteExpense,
                addWash, addExpense, onServiceChange, toasts, confirmState,
                changeDay, changeExpenseDay, fancyDateLabel, fancyExpenseDateLabel, selectableWorkers,
                selectedServices, toggleService, customServiceMode, customServiceText, toggleCustomService, updateDescription
            };
        }
    }).mount('#app');
</script>
</body>
</html>
